[project]
name = "yardim-masasi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ismailarat56", email = "182799816+ismailarat56@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.3",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "rich>=15.0.0",
]

[project.scripts]
yardim-masasi = "yardim_masasi:main"
talep-ozeti = "yardim_masasi.talepler:main"
talep-yukle = "yardim_masasi.veritabani:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pyright]
include = ["src", "tests"]
reportUnnecessaryTypeIgnoreComment = "error"

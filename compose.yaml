name: yardim-masasi

services:
  db:
    image: postgres:18-alpine
    env_file: .env.db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: yardim-masasi
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yardim:yardim@db:5432/yardim_masasi
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: yardim-masasi
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yardim:yardim@db:5432/yardim_masasi
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saglik')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  db-data:

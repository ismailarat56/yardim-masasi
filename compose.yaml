name: yardim-masasi

services:
  db:
    image: postgres:18-alpine
    env_file: .env.db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
